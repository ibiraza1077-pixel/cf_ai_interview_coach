name: Deploy interview coach
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'package*.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: interview-coach-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - name: Deploy Worker and frontend assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ecefb7009a739bec45225d3a850b0a0b
